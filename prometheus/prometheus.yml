# Used by docker compose. The Kubernetes version lives in k8s/prometheus.yaml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081", "payment-service:8082"]

  - job_name: healer
    static_configs:
      - targets: ["detector:8090"]
