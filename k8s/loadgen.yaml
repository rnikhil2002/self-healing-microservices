apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: self-healing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: loadgen:local
          imagePullPolicy: IfNotPresent
          args: ["--url", "http://order-service:8081", "--rate", "20"]
