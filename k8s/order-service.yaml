apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: self-healing
  labels:
    app: order-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: app
          image: order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8082
            - name: JAVA_OPTS
              value: "-Xmx256m"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: self-healing
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
