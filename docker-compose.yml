# Local run without Kubernetes. The healer restarts containers through the Docker API;
# rollback and scaling need Kubernetes (see k8s/ and scripts/kind-up.sh).
services:
  order-service:
    build:
      context: ./services
      args:
        SERVICE: order-service
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8082
    ports:
      - "8081:8081"

  payment-service:
    build:
      context: ./services
      args:
        SERVICE: payment-service
    ports:
      - "8082:8082"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/self-healing.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  detector:
    build: ./detector
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      SERVICES: order-service,payment-service
      REMEDIATION_MODE: docker
      WARMUP_SAMPLES: "24"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8090"
    depends_on:
      - prometheus

  loadgen:
    build: ./load
    command: ["--url", "http://order-service:8081", "--rate", "20"]
    depends_on:
      - order-service
      - payment-service
