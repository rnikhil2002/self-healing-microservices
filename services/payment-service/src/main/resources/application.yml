server:
  port: 8082

spring:
  application:
    name: payment-service

app:
  version: ${APP_VERSION:1.0.0}

chaos:
  latency-ms: 0
  error-rate: 0.0
  leak-mb-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
