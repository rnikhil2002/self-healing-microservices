name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  services:
    name: Spring Boot services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  detector:
    name: Anomaly detector (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  config:
    name: Validate Prometheus and Kubernetes config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool
        run: docker run --rm -v "$PWD/prometheus:/cfg" --entrypoint promtool prom/prometheus:v2.54.1 check config /cfg/prometheus.yml
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  e2e:
    name: End to end on kind (bad release -> rollback, memory leak -> restart)
    runs-on: ubuntu-latest
    needs: [services, detector, config]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: self-healing
      - name: Deploy
        run: bash scripts/kind-up.sh
      - name: Run scenarios
        run: bash scripts/e2e-test.sh
      - name: Debug output
        if: failure()
        run: |
          kubectl -n self-healing get pods -o wide
          kubectl -n self-healing logs deploy/detector --tail=200
          kubectl -n self-healing logs deploy/payment-service --tail=50
          kubectl -n self-healing logs deploy/order-service --tail=50
